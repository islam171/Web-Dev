<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Sign up</title>
</head>
<body>
<main>
    <section>
        <div class="sign">

            <form action="" class="form">

                <div class="logo"><h1>Spotify</h1></div>

                <h2 class="sign__header">Sign up to start listening</h2>

                <p class="message" >Create your account to start listening</p>
                <div class="form__field">
                    <label for="email">
                        Email
                    </label>
                    <input type="email" id="email" class="form__input" placeholder="Enter your email address">
                    <p>We will never share your email with anyone</p>
                </div>
                <div class="form__field">
                    <label for="password">
                        Password
                    </label>
                    <input class="form__input" id="password" type="password" name="password"
                           placeholder="Enter your password">
                    <p>We will never share your email with anyone</p>
                </div>
                <div class="form__field">
                    <label for="username">
                        Username
                    </label>
                    <input class="form__input" type="text" name="username" id="username"
                           placeholder="Enter your username">
                    <p>We will never share your email with anyone</p>
                </div>

                <div class="form__field agree__field">
                    <input id="agree" type="checkbox" name="agree">
                    <label for="agree">
                        I agree to the <span class="green">Terms and Conditions</span>
                    </label>
                    <p>We will never share your email with anyone</p>
                </div>
                <button type="submit" class="form__btn">Sign up</button>
                <div class="links">
                    <a href="#" class="form__link">Already have an account?</a>
                    <a href="#" class="form__link"><span class="green">Log in</span></a>
                </div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
