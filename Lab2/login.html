<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>Facebook - log in or sign up</title>
</head>
<body>
<div class="wrapper">
    <main class="main">
        <div class="__container">

            <div class="main-content">
                <div class="show">
                    <h1>facebook</h1>
                    <h2>Connect with friends and the world around you on Facebook.</h2>
                </div>
                <div class="form">
                    <form action="">
                        <input type="email" placeholder="Email or phone number" name="email" autofocus="1" autocomplete="name">
                        <input type="password" placeholder="Password">
                        <button class="button form__login">Log in</button>
                        <div class="form__forget">
                            <a href="#">Forgot password?</a>
                        </div>
                        <div class="line"></div>
                        <div class="form_signup-label">
                            <button class="button form_signup">Create new account</button>
                        </div>
                    </form>
                    <div class="outside"><p><a href=""><b>Create</b> a <b>Page</b></a> for a celebrity, brand or business.</p></div>
                </div>
            </div>

        </div>
    </main>
    <footer>
        <div class="__container">
            <div class="language">
                <ul>
                    <li>Қазақша</li>
                    <li>Қазақша</li>
                    <li>Қазақша</li>
                    <li>Қазақша</li>
                    <li>Қазақша</li>
                    <li>Қазақша</li>
                    <li>Қазақша</li>
                </ul>
                <button title="show more languages" class="addLanguage">+</button>
            </div>
            <div class="links">
                <ul>
                    <li><a href="">Тіркелу</a></li>
                    <li><a href="">Тіркелу</a></li>
                    <li><a href="">Тіркелу</a></li>
                    <li><a href="">Тіркелу</a></li>
                    <li><a href="">Тіркелу</a></li>
                    <li><a href="">Тіркелу</a></li>
                </ul>
            </div>
            <div class="article"></div>
        </div>

    </footer>
</div>
</body>
</html>
