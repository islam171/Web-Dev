<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-do list</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header__content">
            <h1>ToDo List</h1>
            </div>
        </div>
    </header>
<main class="main">
    <div class="container">
        <div class="todo">
            <div class="todo__header">
                ToDoList
            </div>
            <div class="todo__input">
                <input type="text" class="todo__in" placeholder="New Task">
                <button class="todo__btn">Add</button>
            </div>
            <div class="todo__content">
                <ul class="todo__list">
                </ul>
            </div>
        </div>
    </div>
</main>

    <script src="script.js"></script>
</body>
</html>
