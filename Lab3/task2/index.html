<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-do list</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
<header class="header">
    <div class="container">
        <div class="header__content">
            <h1>ToDo List</h1>
        </div>
    </div>
</header>
<main class="main">
    <div class="container">
        <div class="todo">

            <div class="todo__control">
                <h1 class="todo__header">
                    New Task
                </h1>
                <form class="todo__input">
                    <label for="add">
                        <input type="text" class="todo__in" placeholder="New Task" id="add">
                    </label>
                    <button class="todo__btn">Add</button>
                </form>
                <div class="todo__filter">
                    <button id="all" class="filter__btn active" data-filter="all">All</button>
                    <button id="active" class="filter__btn" data-filter="active">Active</button>
                    <button id="completed" class="filter__btn" data-filter="completed">Completed</button>
                </div>
            </div>
            <div class="todo__content">
                <ul class="todo__list">
                </ul>
            </div>
        </div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
