<script>
  alert('Hello'); alert('World');

  alert('Hello');
  alert('World');

  alert('Hello')

  alert(3 +

  alert("Hello");

  [1, 2].forEach(alert);


  alert("Hello")

*/

  alert('World');

  /* Commenting out the code
alert('Hello');
*/
  alert('World');

  /*
  /* nested comment ?!? */
  */
