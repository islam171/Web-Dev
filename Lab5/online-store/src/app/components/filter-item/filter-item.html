<div [class]="listClass()" >

    <div class="filterItem__label">Category</div>
    <div class="filterItem__main " (click)="setStatus()">
        {{this.selectedCategory?.view}}
    </div>

    <ul class="filterItem__list">
        <li (click)="select(this.categoryAll)">
            All
        </li>
        @for (item of categoryData.getData(); track $index){
            <li (click)="select(item)">
                {{item.view}}
            </li>
        }
    </ul>
</div>
